# ===================== SERVER =====================
server.port=8080

# ===================== DATABASE =====================
# Create the database first:  CREATE DATABASE resolveai;
spring.datasource.url=jdbc:mysql://localhost:3306/resolveai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update is used for this portfolio project so the schema is created/updated
# automatically from the JPA entities on startup with an empty database. For a real
# production system you would switch to Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== JWT =====================
# Change this secret in production and never commit real secrets to GitHub.
app.jwt.secret=${JWT_SECRET:ResolveAI_Super_Secret_Key_Change_In_Production_1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================== AI SERVICE =====================
# Set to "mock" to use the built-in offline mock AI implementation (default, no key needed).
# Set to "openai" to call a real AI provider - requires AI_API_KEY to be set.
app.ai.provider=${AI_PROVIDER:mock}
app.ai.api-key=${AI_API_KEY:}
app.ai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
app.ai.timeout-ms=${AI_TIMEOUT_MS:8000}

# ===================== SLA =====================
app.sla.default-hours=${SLA_DEFAULT_HOURS:48}

# ===================== CORS =====================
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# ===================== LOGGING =====================
logging.level.com.resolveai=INFO
